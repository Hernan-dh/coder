[project]
name = "coder"
version = "0.1.0"
description = "coder using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "arize-phoenix-otel>=0.6,<1",
    "crewai[google-genai,tools]==1.15.20",
    "requests>=2.32.0",
    "ddgs>=9.0.0",
    "openinference-instrumentation-crewai>=0.1,<1",
]

[project.scripts]
coder = "coder.main:run"
run_crew = "coder.main:run"
train = "coder.main:train"
replay = "coder.main:replay"
test = "coder.main:test"
run_with_trigger = "coder.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "9fbe47f7-0afe-4675-b204-457e139593b6"
